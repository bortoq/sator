[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sator"
dynamic = ["version"]
description = "Search And TORrent — multi-tracker torrent search tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["torrent", "search", "bittorrent", "tracker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",

    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/bortoq/sator"

[project.scripts]
sator = "sator.cli:main"

[tool.setuptools.packages.find]
include = ["sator*"]

[tool.setuptools.dynamic]
version = {attr = "sator.settings.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Start CI with correctness checks; style rules can be adopted incrementally.
select = ["E9", "F63", "F7", "F82", "F601"]
